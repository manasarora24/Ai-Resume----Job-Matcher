services:
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://careeriq:careeriq@db:5432/careeriq
      UPLOAD_DIR: /app/uploads
      FRONTEND_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    volumes: ["resume_uploads:/app/uploads"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: careeriq
      POSTGRES_PASSWORD: careeriq
      POSTGRES_DB: careeriq
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careeriq -d careeriq"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
  resume_uploads:
